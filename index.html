<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factsmaster</title>
  </head>
  <body>
    <main>
      <h1>Factsmaster!</h1>
      <div id="output"></div>
      <div id="form">
        <form>
          <div>
            <select id="operator">
              <option value="add">Add (+)</option>
              <option value="multiply">Multiply (⨉)</option>
            </select>
          </div>
          <div>
            <label for="start">Start</label>
            <input type="number" step="1" min="1" max="100" id="start" />
          </div>
          <div>
            <label for="end">End</label>
            <input type="number" step="1" min="1" max="100" id="end" />
          </div>
          <input type="button" id="submit" value="Generate" />
        </form>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
