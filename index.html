<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/FMlogo.png" />
    <title>Factsmaster</title>
  </head>
  <body>
    <main>
      <header class="app-header">
        <img
          src="/FMlogo.png"
          alt="Factsmaster FM logo"
          class="app-logo"
        />
        <h1 class="app-title">Factsmaster!</h1>
      </header>
      <div id="output"></div>
      <div id="form">
        <form>
          <div>
            <select id="operator">
              <option value="add">Add (+)</option>
              <option value="multiply">Multiply (⨉)</option>
            </select>
          </div>
          <div>
            <label for="palette">Palette</label>
            <select id="palette">
              <option value="default">Midnight</option>
              <option value="forest">Forest</option>
              <option value="sunrise">Sunrise</option>
              <option value="Greyscale">Greyscale</option>
            </select>
          </div>
          <div>
            <label for="start">Start</label>
            <input type="number" step="1" min="1" max="100" id="start" />
          </div>
          <div>
            <label for="end">End</label>
            <input type="number" step="1" min="1" max="100" id="end" />
          </div>
          <input type="button" id="submit" value="Generate" />
        </form>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
